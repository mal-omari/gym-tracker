<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<title>4-Week Program</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap');
:root {
  --bg:#0e0e0e;--surface:#161616;--s2:#1e1e1e;--border:#2a2a2a;
  --accent:#c8f135;--text:#f0f0f0;--muted:#666;
  --push:#c8f135;--pull:#38bdf8;--legs:#fb923c;--cardio:#a78bfa;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;}
#app{display:flex;flex-direction:column;height:100%;}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(16px + var(--sb));}

/* TOP BAR */
.topbar{padding:calc(var(--st)+14px) 14px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar .ey{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
.topbar h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em;}
.topbar h1 em{color:var(--accent);font-style:normal;}

/* NAV */
.nav{display:flex;background:#111;border-top:1px solid var(--border);padding-bottom:var(--sb);flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;background:none;border:none;color:var(--muted);font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.04em;cursor:pointer;}
.nb .ic{font-size:18px;line-height:1;}
.nb.on{color:var(--accent);}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.card.push{background:rgba(200,241,53,.08);border-color:rgba(200,241,53,.25);}
.card.pull{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.25);}
.card.legs{background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.25);}
.card.cardio{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.25);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 8px;text-align:center;}
.sc .n{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);}
.sc .l{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:3px;letter-spacing:.08em;}

/* WEEK STRIP */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.wday{border-radius:8px;padding:7px 2px 5px;text-align:center;border:1px solid transparent;cursor:pointer;transition:transform .1s;}
.wday:active{transform:scale(.95);}
.wday .dn{font-family:'DM Mono',monospace;font-size:10px;margin-bottom:2px;}
.wday .dl{font-size:8px;font-family:'DM Mono',monospace;opacity:.7;}
.wday.push{background:rgba(200,241,53,.12);color:var(--push);border-color:rgba(200,241,53,.25);}
.wday.pull{background:rgba(56,189,248,.12);color:var(--pull);border-color:rgba(56,189,248,.25);}
.wday.legs{background:rgba(251,146,60,.12);color:var(--legs);border-color:rgba(251,146,60,.25);}
.wday.cardio{background:rgba(167,139,250,.12);color:var(--cardio);border-color:rgba(167,139,250,.25);}
.wday.rest{background:var(--surface);color:var(--muted);}
.wday.today{box-shadow:0 0 0 2px var(--accent);}
.wday.done .dl::before{content:'✓ ';color:var(--accent);}
.wday.missed{opacity:.4;}

/* SECTION LABEL */
.slbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:16px 0 8px;}

/* BUTTONS */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#0e0e0e;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-align:center;}
.btn:active{opacity:.85;}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;margin-top:8px;}

/* SESSION HEADER */
.shead{padding:calc(var(--st)+12px) 14px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px;}
.back{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-size:15px;cursor:pointer;flex-shrink:0;}
.stitle{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.sbadge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;margin-left:auto;flex-shrink:0;}
.wu{background:var(--s2);border-bottom:1px solid var(--border);padding:9px 14px;flex-shrink:0;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);}
.wu strong{color:var(--text);}

/* EXERCISE CARD */
.exc{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden;}
.exh{padding:12px 12px 9px;border-bottom:1px solid var(--border);}
.exh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.exn{font-weight:600;font-size:14px;}
.exm{font-size:11px;color:var(--muted);margin-top:2px;}
.extb{font-family:'DM Mono',monospace;font-size:11px;padding:3px 7px;border-radius:4px;white-space:nowrap;background:rgba(200,241,53,.1);color:var(--accent);border:1px solid rgba(200,241,53,.2);flex-shrink:0;}

/* NOTES */
.exnote{background:var(--s2);border-radius:7px;padding:9px 10px;font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px;}
.exnote strong{color:#e0c060;}

/* SET TABLE */
.setlbls{display:grid;grid-template-columns:24px 1fr 1fr 32px;gap:6px;padding:5px 12px 2px;}
.setlbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.08em;}
.setr{display:grid;grid-template-columns:24px 1fr 1fr 32px;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--border);}
.setr:last-child{border-bottom:none;}
.snum{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;}
.sinput{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 6px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;width:100%;text-align:center;-webkit-appearance:none;}
.sinput:focus{outline:none;border-color:var(--accent);}
.sinput::placeholder{color:var(--muted);font-size:11px;}
.sinput:disabled{opacity:.4;}
.schk{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;flex-shrink:0;}
.schk.on{background:var(--accent);border-color:var(--accent);color:#0e0e0e;}

/* PROGRESS MINI CHART inside session */
.prog-section{border-top:1px solid var(--border);padding:10px 12px;}
.prog-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.prog-best{font-size:11px;color:var(--muted);margin-bottom:6px;}
.prog-best span{color:var(--accent);font-family:'DM Mono',monospace;font-weight:500;}
canvas.minichart{width:100%;height:52px;display:block;}
.no-data{font-size:11px;color:var(--muted);font-style:italic;padding:4px 0;}

/* NOTES INPUT */
.notes-wrap{padding:10px 12px;border-top:1px solid var(--border);}
.notes-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.notes-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;resize:none;min-height:52px;}
.notes-input:focus{outline:none;border-color:var(--accent);}
.notes-input::placeholder{color:var(--muted);}

/* SESSION FOOTER */
.sfooter{padding:12px 14px calc(12px + var(--sb));border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.pbar{height:3px;background:var(--border);border-radius:2px;margin-bottom:10px;overflow:hidden;}
.pfill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}

/* CALENDAR */
.calwk{margin-bottom:18px;}
.wlbl2{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.chdr{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-align:center;margin-bottom:3px;}
.ccell{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono',monospace;position:relative;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
.ccell:active{transform:scale(.93);}
.ccell.push{background:rgba(200,241,53,.12);color:var(--push);border-color:rgba(200,241,53,.2);}
.ccell.pull{background:rgba(56,189,248,.12);color:var(--pull);border-color:rgba(56,189,248,.2);}
.ccell.legs{background:rgba(251,146,60,.12);color:var(--legs);border-color:rgba(251,146,60,.2);}
.ccell.cardio{background:rgba(167,139,250,.12);color:var(--cardio);border-color:rgba(167,139,250,.2);}
.ccell.rest{background:var(--surface);color:var(--muted);}
.ccell.done::after{content:'✓';position:absolute;top:1px;right:3px;font-size:8px;color:var(--accent);}
.ccell.missed{opacity:.35;}
.ccell.today{box-shadow:0 0 0 2px var(--accent);}
.ccell .cn{font-size:10px;font-weight:500;}
.ccell .ca{font-size:8px;opacity:.8;}

/* HISTORY */
.hcard{background:var(--surface);border-radius:11px;padding:13px;margin-bottom:9px;border-left:3px solid var(--accent);}
.htop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.hname{font-weight:600;font-size:14px;}
.hdate{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.hrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--border);}
.hrow:last-child{border-bottom:none;}
.hrow span:last-child{color:var(--accent);font-family:'DM Mono',monospace;}

/* PROGRESS TAB */
.pex-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden;}
.pex-head{padding:12px 12px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.pex-name{font-weight:600;font-size:13px;}
.pex-pr{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);}
.pex-body{padding:10px 12px;}
canvas.fullchart{width:100%;height:80px;display:block;margin-bottom:8px;}
.pex-hist{font-size:11px;}
.pex-hist-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);color:var(--muted);}
.pex-hist-row:last-child{border-bottom:none;}
.pex-hist-row span:last-child{color:var(--text);font-family:'DM Mono',monospace;}
.pex-filter{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.pex-filter button{font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.pex-filter button.on{background:var(--accent);color:#0e0e0e;border-color:var(--accent);}

/* PREVIEW BANNER */
.preview-banner{background:rgba(200,241,53,.08);border:1px solid rgba(200,241,53,.2);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--accent);text-align:center;}

/* TOAST */
.toast{position:fixed;bottom:calc(70px + var(--sb));left:50%;transform:translateX(-50%) translateY(14px);background:var(--accent);color:#0e0e0e;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px 22px;border-radius:100px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
.empty .ei{font-size:34px;margin-bottom:10px;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.ld{width:7px;height:7px;border-radius:50%;}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
</style>
</head>
<body>
<div id="app">

<!-- TODAY -->
<div class="screen active" id="s-today">
  <div class="topbar">
    <div class="ey" id="t-date">—</div>
    <h1>Ready to <em>train?</em></h1>
  </div>
  <div class="scroll">
    <div id="t-card"></div>
    <div class="stats">
      <div class="sc"><div class="n" id="st-done">0</div><div class="l">Done</div></div>
      <div class="sc"><div class="n" id="st-streak">0</div><div class="l">Streak</div></div>
      <div class="sc"><div class="n" id="st-week">W1</div><div class="l">Week</div></div>
    </div>
    <div class="slbl">This Week</div>
    <div id="t-weekstrip"></div>
    <div class="slbl">Coming Up</div>
    <div id="t-nextup"></div>
  </div>
  <div class="nav">
    <button class="nb on" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- CALENDAR -->
<div class="screen" id="s-calendar">
  <div class="topbar"><div class="ey">4-Week Program</div><h1><em>Full</em> Schedule</h1></div>
  <div class="scroll">
    <div class="legend">
      <div class="li"><div class="ld" style="background:var(--push)"></div>Push</div>
      <div class="li"><div class="ld" style="background:var(--pull)"></div>Pull</div>
      <div class="li"><div class="ld" style="background:var(--legs)"></div>Legs</div>
      <div class="li"><div class="ld" style="background:var(--cardio)"></div>Cardio+</div>
    </div>
    <div id="cal-content"></div>
  </div>
  <div class="nav">
    <button class="nb" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb on" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- PROGRESS -->
<div class="screen" id="s-progress">
  <div class="topbar"><div class="ey">Your Gains</div><h1><em>Progress</em></h1></div>
  <div class="scroll">
    <div class="pex-filter" id="prog-filter"></div>
    <div id="prog-content"></div>
  </div>
  <div class="nav">
    <button class="nb" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb on" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- HISTORY -->
<div class="screen" id="s-history">
  <div class="topbar"><div class="ey">Workout Log</div><h1><em>History</em></h1></div>
  <div class="scroll" id="hist-content"></div>
  <div class="nav">
    <button class="nb" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb on" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- SESSION -->
<div class="screen" id="s-session">
  <div class="shead">
    <button class="back" onclick="exitSession()">←</button>
    <div><div class="stitle" id="sess-title">—</div><div style="font-size:11px;color:var(--muted)" id="sess-sub">—</div></div>
    <div class="sbadge" id="sess-badge">W1</div>
  </div>
  <div class="wu" id="sess-wu"></div>
  <div class="scroll" id="sess-exs"></div>
  <div class="sfooter">
    <div class="pbar"><div class="pfill" id="sess-prog" style="width:0%"></div></div>
    <button class="btn" id="sess-btn" onclick="completeSession()">Complete Workout ✓</button>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
// ━━ PROGRAM ━━
const START = new Date('2026-06-15T00:00:00');
const PATTERN = ['push','rest','pull','rest','legs','cardio','rest'];

const WORKOUTS = {
  push:{
    name:'Push Day', focus:'Chest · Shoulders · Triceps', color:'#c8f135', type:'push',
    wu:{icon:'🚴',txt:'Warmup: <strong>5 min spin bike</strong>, easy pace'},
    exs:[
      {n:'Barbell Bench Press', m:'Power Rack + Bench',
       note:'🔧 Set bar at chest height. Grip just outside shoulder width. Plant feet, arch slightly, drive bar up. Control the descent — 2 sec down.',
       t:['3×8','4×8','4×10','4×12']},
      {n:'Dumbbell Shoulder Press', m:'DBs 25–35 lbs',
       note:'🔧 Sit upright, DBs at ear level. Press straight up, don\'t flare elbows forward. Squeeze at top.',
       t:['3×10','3×12','4×10','4×12']},
      {n:'Machine Press', m:'Matrix Multi-Position Press',
       note:'🔧 Adjust seat so handles are at mid-chest. Control both push and return phases equally.',
       t:['3×12','3×12','3×15','4×12']},
      {n:'Lateral Raises', m:'DBs 10–15 lbs',
       note:'🔧 Slight bend in elbow. Lead with elbows, not wrists. Stop at shoulder height. No swinging — slow and controlled.',
       t:['3×12','3×15','3×15','4×15']},
      {n:'Cable Tricep Pushdown', m:'Lat pulldown station (rope)',
       note:'🔧 Elbows pinned to sides — they should not move. Split the rope at the bottom, fully extend. Squeeze triceps hard.',
       t:['3×12','3×12','3×15','4×12']},
      {n:'Overhead Tricep Extension', m:'DBs 15–20 lbs',
       note:'🔧 Hold one DB with both hands overhead. Lower behind head slowly, keep elbows pointing forward. Full stretch at bottom.',
       t:['3×12','3×12','3×15','3×15']},
    ]
  },
  pull:{
    name:'Pull Day', focus:'Back · Biceps', color:'#38bdf8', type:'pull',
    wu:{icon:'🚣',txt:'Warmup: <strong>5 min rowing machine</strong>, moderate pace'},
    exs:[
      {n:'Lat Pulldown', m:'Matrix Lat Pulldown',
       note:'🔧 Wide overhand grip. Lean back slightly, pull bar to upper chest. Squeeze shoulder blades together. Control the rise.',
       t:['3×10','4×10','4×12','4×12']},
      {n:'Seated Cable Row', m:'Matrix Low Row',
       note:'🔧 Sit tall, chest up. Pull handle to lower chest/belly button. Hold 1 sec, fully extend arms on return. Don\'t round back.',
       t:['3×10','3×12','4×10','4×12']},
      {n:'Dumbbell Bent-Over Row', m:'DBs 30–45 lbs',
       note:'🔧 Brace core, flat back, hinge at hips ~45°. Pull DB to hip, elbow close to body. Squeeze at top. Other hand on bench.',
       t:['3×10ea','3×12ea','3×12ea','4×10ea']},
      {n:'Face Pulls', m:'Cable station (rope)',
       note:'🔧 Set cable at face height. Pull rope to face, hands beside ears, elbows flared wide. Great for shoulder health — don\'t skip.',
       t:['3×15','3×15','3×20','4×15']},
      {n:'Dumbbell Curl', m:'DBs 20–30 lbs',
       note:'🔧 Elbows glued to sides. Full range — fully extend at bottom, squeeze at top. No swinging. Supinate wrist as you curl.',
       t:['3×10','3×12','3×12','4×10']},
      {n:'Hammer Curl', m:'DBs 20–25 lbs',
       note:'🔧 Neutral grip (thumbs up). Hits the brachialis and forearm. Same rules — no swing, full extension.',
       t:['2×12','3×10','3×12','3×12']},
      {n:'Hanging Knee Raise', m:'VKR Station',
       note:'🔧 Hang from bar or use arm rests. Curl knees to chest — don\'t just swing legs. Control the lower. For extra: pause at top.',
       t:['3×12','3×15','3×15','3×20']},
    ]
  },
  legs:{
    name:'Leg Day', focus:'Quads · Hamstrings · Core', color:'#fb923c', type:'legs',
    wu:{icon:'🏃',txt:'Warmup: <strong>5 min treadmill</strong> incline walk (3.5 mph, 5%)'},

// ━━ STATE ━━
let S={sessions:{}};
function save(){localStorage.setItem('gapp_v4',JSON.stringify(S));}
function load(){const r=localStorage.getItem('gapp_v4');if(r)S=JSON.parse(r);}

// ━━ HELPERS ━━
function dk(d){return d.toISOString().split('T')[0];}
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}

function getPD(date){
  const s=new Date(START);s.setHours(0,0,0,0);
  const d=new Date(date);d.setHours(0,0,0,0);
  const diff=Math.floor((d-s)/86400000);
  if(diff<0||diff>=28)return null;
  return{week:Math.floor(diff/7),dow:diff%7,type:PATTERN[diff%7],diff};
}

function tColor(t){return{push:'#c8f135',pull:'#38bdf8',legs:'#fb923c',cardio:'#a78bfa',rest:'#333'}[t]||'#333';}
function tLabel(t){return{push:'Push',pull:'Pull',legs:'Legs',cardio:'Cardio+',rest:'Rest'}[t]||'Rest';}
function numSets(ex,week){const m=(ex.t[week]||ex.t[0]).match(/^(\d+)/);return m?parseInt(m[1]):3;}

// ━━ NAV ━━
let prevScreen='today';
let curScreen='today';
function nav(name){
  prevScreen=curScreen;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-'+name).classList.add('active');
  const map={today:0,calendar:1,progress:2,history:3};
  const idx=map[name];
  if(idx!==undefined) document.querySelectorAll('.nb')[idx].classList.add('on');
  curScreen=name;
  if(name==='today')renderToday();
  if(name==='calendar')renderCalendar();
  if(name==='progress')renderProgress(null);
  if(name==='history')renderHistory();
}

// ━━ TODAY ━━
function renderToday(){
  const now=today();
  document.getElementById('t-date').textContent=now.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});
  const pd=getPD(now);
  const key=dk(now);

  // Today card
  let html='';
  if(!pd){
    const du=Math.floor((new Date(START)-now)/86400000);
    html=`<div class="card"><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px">Program Status</div>
    <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800">${du>0?'Starts in '+du+' days':'Complete! 🎉'}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">${du>0?'Starting Monday June 16':'4 weeks done. Incredible work.'}</div></div>`;
  } else if(pd.type==='rest'){
    html=`<div class="card"><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px">Week ${pd.week+1} · Rest Day</div>
    <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800">Recovery Day</div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">🚴 Bike commute counts. 💧 Hit your water. 🥩 Eat your protein.</div></div>`;
  } else {
    const W=WORKOUTS[pd.type];const c=W.color;
    const done=S.sessions[key]&&S.sessions[key].completed;
    html=`<div class="card ${pd.type}">
    <div style="font-family:'DM Mono',monospace;font-size:10px;color:${c};text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px">Week ${pd.week+1} · ${tLabel(pd.type)} Day</div>
    <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:3px">${W.name}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${W.focus}</div>
    ${done
      ?`<div class="btn" style="background:${c};opacity:.55;cursor:default">✓ Completed Today</div>`
      :`<button class="btn" style="background:${c}" onclick="startSession('${pd.type}',${pd.week},'${key}')">Start Workout →</button>`
    }</div>`;
  }
  document.getElementById('t-card').innerHTML=html;

  // Stats
  const allDone=Object.values(S.sessions).filter(s=>s.completed);
  document.getElementById('st-done').textContent=allDone.length;
  document.getElementById('st-week').textContent=pd?`W${pd.week+1}`:'—';
  let streak=0,sd=new Date(now);
  while(true){const spd=getPD(sd);if(!spd)break;if(spd.type==='rest'){sd=addDays(sd,-1);continue;}if(S.sessions[dk(sd)]&&S.sessions[dk(sd)].completed){streak++;sd=addDays(sd,-1);}else break;}
  document.getElementById('st-streak').textContent=streak;

  // Week strip
  const monBased=(new Date(now).getDay()+6)%7;
  const wStart=addDays(now,-monBased);
  const dayL=['M','T','W','T','F','S','S'];
  let ws='';
  for(let i=0;i<7;i++){
    const d=addDays(wStart,i);const spd=getPD(d);
    const t=spd?spd.type:'rest';const k=dk(d);
    const isDone=S.sessions[k]&&S.sessions[k].completed;
    const isToday=dk(d)===dk(now);

      <div class="dn">${dayL[i]}</div><div class="dl">${d.getDate()}</div></div>`;

  document.getElementById('t-weekstrip').innerHTML=ws;

  // Next up
  let nu='',found=0,nd=addDays(now,1);
  while(found<3){

    if(spd.type!=='rest'){

      nu+=`<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;cursor:pointer" onclick="startSession('${spd.type}',${spd.week},'${dk(nd)}')">

          <div style="font-size:11px;color:var(--muted)">${W.focus}</div>
        </div>

      </div>`;
      found++;

    nd=addDays(nd,1);
  }

// ━━ CALENDAR ━━
function renderCalendar(){
  const now=today();let html='';
  for(let w=0;w<4;w++){
    const wStart=addDays(START,w*7);
    const fmt=d=>d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
    let wDone=0,wTotal=0;
    html+=`<div class="calwk"><div class="wlbl2">Week ${w+1} — ${fmt(wStart)} to ${fmt(addDays(wStart,6))}</div>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:3px">`;
    ['M','T','W','T','F','S','S'].forEach(l=>html+=`<div class="chdr">${l}</div>`);
    html+=`</div><div class="calgrid">`;
    for(let d=0;d<7;d++){
      const date=addDays(wStart,d);const type=PATTERN[d];
      const k=dk(date);const isDone=S.sessions[k]&&S.sessions[k].completed;
      const isToday=dk(date)===dk(now);const isPast=date<now&&!isToday;
      const isMissed=isPast&&type!=='rest'&&!isDone;
      if(type!=='rest')wTotal++;if(isDone)wDone++;
      html+=`<div class="ccell ${type} ${isDone?'done':''} ${isMissed?'missed':''} ${isToday?'today':''}"
        onclick="calTap('${k}','${type}',${w})">
        <div class="cn">${date.getDate()}</div><div class="ca">${tLabel(type).slice(0,3)}</div></div>`;
    }
    html+=`</div><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:right;margin-top:5px">${wDone}/${wTotal} done</div></div>`;
  }
  document.getElementById('cal-content').innerHTML=html;
}

function calTap(k,type,week){
  if(type==='rest')return;
  startSession(type,week,k);
}

// ━━ SESSION ━━
let CUR={type:null,week:0,key:null};

function startSession(type,week,key){
  CUR={type,week,key};
  const W=WORKOUTS[type];
  const now=today();
  const sessionDate=new Date(key);sessionDate.setHours(0,0,0,0);
  const isFuture=sessionDate>now;

  if(!S.sessions[key]){
    S.sessions[key]={type,week,completed:false,
      exs:W.exs.map(ex=>({sets:Array.from({length:numSets(ex,week)},()=>({w:'',r:'',done:false})),note:''}))};
    save();
  }

  document.getElementById('sess-title').textContent=W.name;
  document.getElementById('sess-sub').textContent=W.focus;
  document.getElementById('sess-badge').textContent=`W${week+1}`;
  document.getElementById('sess-badge').style.color=W.color;
  document.getElementById('sess-badge').style.background=W.color+'22';
  document.getElementById('sess-wu').innerHTML=`<span style="font-size:17px">${W.wu.icon}</span><span>${W.wu.txt}</span>`;

  if(isFuture){
    document.getElementById('sess-btn').textContent='← Go Back';
    document.getElementById('sess-btn').onclick=exitSession;
    document.getElementById('sess-btn').style.background='var(--surface)';
    document.getElementById('sess-btn').style.color='var(--text)';
    document.getElementById('sess-btn').style.border='1px solid var(--border)';
  } else {
    document.getElementById('sess-btn').textContent='Complete Workout ✓';
    document.getElementById('sess-btn').onclick=completeSession;
    document.getElementById('sess-btn').style.background=W.color;
    document.getElementById('sess-btn').style.color='#0e0e0e';
    document.getElementById('sess-btn').style.border='none';
  }

  renderSessionExs(isFuture);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-session').classList.add('active');
}

function renderSessionExs(isFuture){
  const {type,week,key}=CUR;
  const W=WORKOUTS[type];
  const sd=S.sessions[key];
  let html='';
  let tot=0,dn=0;

  if(isFuture){
    const date=new Date(key);
    html=`<div class="preview-banner">📅 ${date.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})} — Preview mode. Logging unlocks on the day.</div>`;
  }

  W.exs.forEach((ex,ei)=>{
    const target=ex.t[week]||ex.t[0];
    const exData=sd?sd.exs[ei]:null;
    const ns=exData?exData.sets.length:numSets(ex,week);
    if(!isFuture&&exData){tot+=ns;dn+=exData.sets.filter(s=>s.done).length;}

    // Build progress history for this exercise
    const history=getExHistory(type,ei);
    const hasHistory=history.length>0;

    html+=`<div class="exc">
      <div class="exh">
        <div class="exh-top">
          <div><div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)">Ex ${ei+1}</div>
          <div class="exn">${ex.n}</div><div class="exm">${ex.m}</div></div>
          <div class="extb">${target}</div>
        </div>
        <div class="exnote">${ex.note}</div>
      </div>`;

    // Sets
    if(!isFuture){
      html+=`<div class="setlbls"><div class="setlbl">Set</div><div class="setlbl">lbs</div><div class="setlbl">Reps</div><div class="setlbl">✓</div></div><div>`;
      for(let si=0;si<ns;si++){
        const set=exData?exData.sets[si]:{w:'',r:'',done:false};
        html+=`<div class="setr">
          <div class="snum">${si+1}</div>
          <input class="sinput" type="number" inputmode="decimal" placeholder="lbs" value="${set.w}"
            onchange="upd(${ei},${si},'w',this.value)" ${set.done?'disabled':''}>
          <input class="sinput" type="number" inputmode="numeric" placeholder="reps" value="${set.r}"
            onchange="upd(${ei},${si},'r',this.value)" ${set.done?'disabled':''}>
          <button class="schk${set.done?' on':''}" onclick="tog(${ei},${si})">${set.done?'✓':''}</button>
        </div>`;
      }
      html+=`</div>`;
    } else {
      // Preview: show target sets grayed out
      html+=`<div class="setlbls"><div class="setlbl">Set</div><div class="setlbl">lbs</div><div class="setlbl">Reps</div><div class="setlbl">✓</div></div><div>`;
      for(let si=0;si<ns;si++){
        html+=`<div class="setr"><div class="snum">${si+1}</div>
          <input class="sinput" disabled placeholder="—">
          <input class="sinput" disabled placeholder="—">
          <button class="schk" disabled></button></div>`;
      }
      html+=`</div>`;
    }

    // Mini progress chart
    html+=`<div class="prog-section">
      <div class="prog-title">Your Progress — ${ex.n}</div>`;
    if(hasHistory){
      const best=history[history.length-1];
      const pr=Math.max(...history.map(h=>h.w));
      html+=`<div class="prog-best">Best set: <span>${pr} lbs</span> · Last: <span>${best.w} lbs × ${best.r} reps</span></div>`;
      html+=`<canvas class="minichart" id="mini-${ei}" width="400" height="104"></canvas>`;
    } else {
      html+=`<div class="no-data">No history yet — log your first session to start tracking.</div>`;
    }
    html+=`</div>`;

    // Personal notes
    if(!isFuture){
      const savedNote=exData?exData.note:'';
      html+=`<div class="notes-wrap">
        <div class="notes-lbl">My Notes</div>
        <textarea class="notes-input" placeholder="e.g. used 35 lbs, felt strong, increase next time..."
          onchange="updNote(${ei},this.value)">${savedNote}</textarea>
      </div>`;
    }

    html+=`</div>`;
  });

  document.getElementById('sess-exs').innerHTML=html;
  if(!isFuture){
    document.getElementById('sess-prog').style.width=(tot>0?(dn/tot)*100:0)+'%';
  }

  // Draw mini charts after render
  requestAnimationFrame(()=>{
    W.exs.forEach((ex,ei)=>{
      const history=getExHistory(type,ei);
      if(history.length>0){
        const canvas=document.getElementById(`mini-${ei}`);
        if(canvas)drawChart(canvas,history,'#c8f135',true);
      }
    });
  });
}

function upd(ei,si,field,val){
  S.sessions[CUR.key].exs[ei].sets[si][field]=val;save();
  // update progress bar
  const sd=S.sessions[CUR.key];const W=WORKOUTS[CUR.type];
  let tot=0,dn=0;
  W.exs.forEach((_,i)=>{tot+=sd.exs[i].sets.length;dn+=sd.exs[i].sets.filter(s=>s.done).length;});
  document.getElementById('sess-prog').style.width=(tot>0?(dn/tot)*100:0)+'%';
}

function tog(ei,si){
  const set=S.sessions[CUR.key].exs[ei].sets[si];
  set.done=!set.done;save();
  const now=today();const sd=new Date(CUR.key);sd.setHours(0,0,0,0);
  renderSessionExs(sd>now);
}

function updNote(ei,val){
  S.sessions[CUR.key].exs[ei].note=val;save();
}

function completeSession(){
  const k=CUR.key;
  S.sessions[k].completed=true;
  S.sessions[k].completedAt=new Date().toISOString();
  save();toast('Workout complete! 💪');
  setTimeout(()=>nav('today'),1100);
}

function exitSession(){nav(prevScreen==='session'?'today':prevScreen);}

// ━━ PROGRESS DATA ━━
function getExHistory(type,ei){
  const results=[];
  Object.entries(S.sessions)
    .filter(([k,s])=>s.completed&&s.type===type&&s.exs&&s.exs[ei])
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .forEach(([k,s])=>{
      const dsets=s.exs[ei].sets.filter(x=>x.done&&x.w&&x.r);
      if(!dsets.length)return;
      const bestW=Math.max(...dsets.map(x=>parseFloat(x.w)||0));
      const bestR=Math.max(...dsets.filter(x=>parseFloat(x.w)===bestW).map(x=>parseInt(x.r)||0));
      results.push({date:k,w:bestW,r:bestR});
    });
  return results;
}

// ━━ CHART DRAWING ━━
function drawChart(canvas,history,color,mini){
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth*2;const H=canvas.offsetHeight*2;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);

  const vals=history.map(h=>h.w);
  const min=Math.max(0,Math.min(...vals)*0.9);
  const max=Math.max(...vals)*1.1;
  const pad={t:10,r:10,b:mini?20:30,l:mini?36:44};
  const gW=W-pad.l-pad.r;const gH=H-pad.t-pad.b;

  const x=i=>pad.l+i*(gW/(Math.max(history.length-1,1)));
  const y=v=>pad.t+gH-(((v-min)/(max-min||1))*gH);

  // Grid lines
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1;
  [0,.5,1].forEach(f=>{
    const yy=pad.t+gH*(1-f);
    ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    const lbl=Math.round(min+(max-min)*f);
    ctx.fillStyle='#555';ctx.font=`${mini?18:20}px DM Mono,monospace`;
    ctx.textAlign='right';ctx.fillText(lbl+'lb',pad.l-4,yy+6);
  });

  if(history.length<2){
    // Single dot
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(0),y(vals[0]),6,0,Math.PI*2);ctx.fill();
    return;
  }

  // Gradient fill
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+gH);
  grad.addColorStop(0,color+'55');grad.addColorStop(1,color+'00');
  ctx.beginPath();ctx.moveTo(x(0),y(vals[0]));
  history.forEach((_,i)=>{if(i>0)ctx.lineTo(x(i),y(vals[i]));});
  ctx.lineTo(x(history.length-1),pad.t+gH);ctx.lineTo(x(0),pad.t+gH);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // Line
  ctx.beginPath();ctx.moveTo(x(0),y(vals[0]));
  history.forEach((_,i)=>{if(i>0)ctx.lineTo(x(i),y(vals[i]));});
  ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();

  // Dots + date labels
  history.forEach((h,i)=>{
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(i),y(h.w),5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x(i),y(h.w),2,0,Math.PI*2);ctx.fill();
    if(!mini){
      const d=new Date(h.date);
      ctx.fillStyle='#555';ctx.font='18px DM Mono,monospace';ctx.textAlign='center';
      ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x(i),H-4);
    }
  });
}

function renderProgress(filter){
  progFilter=filter;
  // Build filter buttons
  const types=['push','pull','legs','cardio'];
  let fhtml='<button class="'+(filter===null?'on':'')+'" onclick="renderProgress(null)">All</button>';
  types.forEach(t=>{
    fhtml+=`<button class="${filter===t?'on':''}" style="${filter===t?`background:${tColor(t)};border-color:${tColor(t)};color:#0e0e0e`:''}"
      onclick="renderProgress('${t}')">${tLabel(t)}</button>`;
  });
  document.getElementById('prog-filter').innerHTML=fhtml;

  // Check if any data
  const anySessions=Object.values(S.sessions).some(s=>s.completed);
  if(!anySessions){
    document.getElementById('prog-content').innerHTML='<div class="empty"><div class="ei">📈</div>Complete your first workout to start tracking progress.</div>';
    return;
  }

  let html='';
  const toShow=filter?[filter]:types;
  toShow.forEach(type=>{
    const W=WORKOUTS[type];
    W.exs.forEach((ex,ei)=>{
      const history=getExHistory(type,ei);
      if(!history.length)return;
      const pr=Math.max(...history.map(h=>h.w));
      const first=history[0].w;
      const gain=pr-first;
      const c=tColor(type);
      html+=`<div class="pex-card">
        <div class="pex-head">
          <div>
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:${c};text-transform:uppercase;letter-spacing:.1em">${tLabel(type)}</div>
            <div class="pex-name">${ex.n}</div>
          </div>
          <div>
            <div class="pex-pr">PR: ${pr} lbs</div>
            ${gain>0?`<div style="font-size:10px;color:var(--muted);text-align:right">+${gain} lbs ↑</div>`:''}
          </div>
        </div>
        <div class="pex-body">
          <canvas class="fullchart" id="full-${type}-${ei}" width="600" height="160"></canvas>
          <div class="pex-hist">
            ${history.slice().reverse().map(h=>{
              const d=new Date(h.date);
              return `<div class="pex-hist-row">
                <span>${d.toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</span>
                <span>${h.w} lbs × ${h.r} reps</span>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
    });
  });

  document.getElementById('prog-content').innerHTML=html||'<div class="empty"><div class="ei">🏋️</div>No data for this category yet.</div>';

  requestAnimationFrame(()=>{
    toShow.forEach(type=>{
      WORKOUTS[type].exs.forEach((ex,ei)=>{
        const history=getExHistory(type,ei);
        if(!history.length)return;
        const canvas=document.getElementById(`full-${type}-${ei}`);
        if(canvas)drawChart(canvas,history,tColor(type),false);
      });
    });
  });
}

// ━━ HISTORY ━━
function renderHistory(){
  const done=Object.entries(S.sessions).filter(([k,s])=>s.completed).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!done.length){
    document.getElementById('hist-content').innerHTML='<div class="empty"><div class="ei">📋</div>No workouts logged yet.<br>Complete your first session!</div>';
    return;
  }
  let html=`<div class="slbl">${done.length} Session${done.length!==1?'s':''} Logged</div>`;
  done.forEach(([k,s])=>{
    const W=WORKOUTS[s.type];const c=tColor(s.type);
    html+=`<div class="hcard" style="border-left-color:${c}">
      <div class="htop">
        <div><div class="hname">${W.name}</div><div style="font-size:10px;color:var(--muted)">Week ${s.week+1}</div></div>
        <div class="hdate">${new Date(k).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div>
      </div>`;
    s.exs.forEach((exd,ei)=>{
      const ex=W.exs[ei];if(!ex)return;
      const dsets=exd.sets.filter(x=>x.done);if(!dsets.length)return;
      const bw=Math.max(...dsets.map(x=>parseFloat(x.w)||0));
      const tr=dsets.reduce((a,x)=>a+(parseInt(x.r)||0),0);
      html+=`<div class="hrow"><span>${ex.n}</span><span>${dsets.length} sets${bw>0?' · '+bw+'lb':''}${tr>0?' · '+tr+' reps':''}</span></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('hist-content').innerHTML=html;
}

// ━━ TOAST ━━
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

// ━━ PWA ━━
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

// ━━ INIT ━━
load();renderToday();
</script>
