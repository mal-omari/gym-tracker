<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<title>4-Week Program</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap');
:root {
  --bg:#0e0e0e;--surface:#161616;--s2:#1e1e1e;--border:#2a2a2a;
  --accent:#c8f135;--text:#f0f0f0;--muted:#666;
  --push:#c8f135;--pull:#38bdf8;--legs:#fb923c;--cardio:#a78bfa;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;}
#app{display:flex;flex-direction:column;height:100%;}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px calc(14px + var(--sb));}

/* TOP BAR */
.topbar{padding:calc(var(--st)+10px) 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar .ey{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
.topbar h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em;}
.topbar h1 em{color:var(--accent);font-style:normal;}

/* NAV */
.nav{display:flex;background:#111;border-top:1px solid var(--border);padding-bottom:var(--sb);flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;background:none;border:none;color:var(--muted);font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.04em;cursor:pointer;}
.nb .ic{font-size:17px;line-height:1;}
.nb.on{color:var(--accent);}

/* TODAY CARD */
.today-card{border-radius:12px;padding:14px;margin-bottom:10px;}
.today-card.push{background:rgba(200,241,53,.08);border:1px solid rgba(200,241,53,.25);}
.today-card.pull{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);}
.today-card.legs{background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.25);}
.today-card.cardio{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);}
.today-card.rest{background:var(--surface);border:1px solid var(--border);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 8px;text-align:center;}
.sc .n{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--accent);}
.sc .l{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:2px;letter-spacing:.08em;}

/* WEEK STRIP — compact horizontal chips */
.wstrip{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.wchip{flex:1;min-width:0;border-radius:8px;padding:6px 4px;text-align:center;border:1px solid transparent;cursor:pointer;flex-shrink:0;}
.wchip .dn{font-family:'DM Mono',monospace;font-size:9px;color:inherit;opacity:.7;margin-bottom:1px;}
.wchip .dd{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;}
.wchip.push{background:rgba(200,241,53,.12);color:var(--push);border-color:rgba(200,241,53,.25);}
.wchip.pull{background:rgba(56,189,248,.12);color:var(--pull);border-color:rgba(56,189,248,.25);}
.wchip.legs{background:rgba(251,146,60,.12);color:var(--legs);border-color:rgba(251,146,60,.25);}
.wchip.cardio{background:rgba(167,139,250,.12);color:var(--cardio);border-color:rgba(167,139,250,.25);}
.wchip.rest{background:var(--surface);color:var(--muted);}
.wchip.today{box-shadow:0 0 0 2px var(--accent);}
.wchip.done .dd::after{content:' ✓';color:var(--accent);font-size:9px;}
.wchip.missed{opacity:.4;}

/* SECTION LABEL */
.slbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:10px 0 6px;}

/* BUTTONS */
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#0e0e0e;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center;}
.btn:active{opacity:.85;}

/* NEXT UP CARDS */
.nextup-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.nextup-card:active{opacity:.8;}
.nuc-left .nuc-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
.nuc-left .nuc-name{font-weight:600;font-size:13px;}
.nuc-left .nuc-focus{font-size:11px;color:var(--muted);}
.nuc-badge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;flex-shrink:0;}

/* SESSION */
.shead{padding:calc(var(--st)+10px) 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px;}
.back{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:14px;cursor:pointer;flex-shrink:0;}
.stitle{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;}
.sbadge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;margin-left:auto;flex-shrink:0;}
.wu{background:var(--s2);border-bottom:1px solid var(--border);padding:8px 14px;flex-shrink:0;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);}
.wu strong{color:var(--text);}

/* EXERCISE CARD */
.exc{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden;}
.exh{padding:11px 12px 8px;border-bottom:1px solid var(--border);}
.exh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px;}
.exn{font-weight:600;font-size:14px;}
.exm{font-size:11px;color:var(--muted);margin-top:1px;}
.extb{font-family:'DM Mono',monospace;font-size:11px;padding:3px 7px;border-radius:4px;white-space:nowrap;background:rgba(200,241,53,.1);color:var(--accent);border:1px solid rgba(200,241,53,.2);flex-shrink:0;}
.exnote{background:var(--s2);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px;}

/* SETS */
.setlbls{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:5px;padding:5px 12px 2px;}
.setlbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;}
.setr{display:grid;grid-template-columns:22px 1fr 1fr 30px;align-items:center;gap:5px;padding:6px 12px;border-bottom:1px solid var(--border);}
.setr:last-child{border-bottom:none;}
.snum{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;}
.sinput{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 4px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;width:100%;text-align:center;-webkit-appearance:none;}
.sinput:focus{outline:none;border-color:var(--accent);}
.sinput::placeholder{color:var(--muted);font-size:11px;}
.sinput:disabled{opacity:.35;}
.schk{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s;flex-shrink:0;}
.schk.on{background:var(--accent);border-color:var(--accent);color:#0e0e0e;}

/* PROGRESS MINI */
.prog-section{border-top:1px solid var(--border);padding:9px 12px;}
.prog-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.prog-best{font-size:11px;color:var(--muted);margin-bottom:5px;}
.prog-best span{color:var(--accent);font-family:'DM Mono',monospace;}
canvas.minichart{width:100%;height:48px;display:block;}
.no-data{font-size:11px;color:var(--muted);font-style:italic;}

/* PERSONAL NOTES */
.notes-wrap{padding:9px 12px;border-top:1px solid var(--border);}
.notes-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.notes-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;resize:none;min-height:48px;}
.notes-input:focus{outline:none;border-color:var(--accent);}
.notes-input::placeholder{color:var(--muted);}

/* SESSION FOOTER */
.sfooter{padding:10px 14px calc(10px + var(--sb));border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.pbar{height:3px;background:var(--border);border-radius:2px;margin-bottom:9px;overflow:hidden;}
.pfill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}

/* CALENDAR */
.calwk{margin-bottom:16px;}
.wlbl2{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.calgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.chdr{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-align:center;margin-bottom:3px;}
.ccell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono',monospace;position:relative;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
.ccell:active{transform:scale(.93);}
.ccell.push{background:rgba(200,241,53,.12);color:var(--push);border-color:rgba(200,241,53,.2);}
.ccell.pull{background:rgba(56,189,248,.12);color:var(--pull);border-color:rgba(56,189,248,.2);}
.ccell.legs{background:rgba(251,146,60,.12);color:var(--legs);border-color:rgba(251,146,60,.2);}
.ccell.cardio{background:rgba(167,139,250,.12);color:var(--cardio);border-color:rgba(167,139,250,.2);}
.ccell.rest{background:var(--surface);color:var(--muted);}
.ccell.done::after{content:'✓';position:absolute;top:1px;right:3px;font-size:8px;color:var(--accent);}
.ccell.missed{opacity:.35;}
.ccell.today{box-shadow:0 0 0 2px var(--accent);}
.ccell .cn{font-size:10px;font-weight:500;}
.ccell .ca{font-size:8px;opacity:.8;}

/* HISTORY */
.hcard{background:var(--surface);border-radius:11px;padding:12px;margin-bottom:8px;border-left:3px solid var(--accent);}
.htop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.hname{font-weight:600;font-size:13px;}
.hdate{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.hrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--border);}
.hrow:last-child{border-bottom:none;}
.hrow span:last-child{color:var(--accent);font-family:'DM Mono',monospace;}

/* PROGRESS TAB */
.pex-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden;}
.pex-head{padding:11px 12px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.pex-name{font-weight:600;font-size:13px;}
.pex-pr{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);}
.pex-body{padding:10px 12px;}
canvas.fullchart{width:100%;height:70px;display:block;margin-bottom:8px;}
.pex-hist-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);}
.pex-hist-row:last-child{border-bottom:none;}
.pex-hist-row span:last-child{color:var(--text);font-family:'DM Mono',monospace;}
.pex-filter{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.pex-filter button{font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.pex-filter button.on{background:var(--accent);color:#0e0e0e;border-color:var(--accent);}

/* PREVIEW */
.preview-banner{background:rgba(200,241,53,.07);border:1px solid rgba(200,241,53,.18);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12px;color:var(--accent);text-align:center;}

/* TOAST */
.toast{position:fixed;bottom:calc(68px + var(--sb));left:50%;transform:translateX(-50%) translateY(14px);background:var(--accent);color:#0e0e0e;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:9px 20px;border-radius:100px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:32px 20px;color:var(--muted);font-size:13px;}
.empty .ei{font-size:30px;margin-bottom:8px;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.ld{width:7px;height:7px;border-radius:50%;}
</style>
</head>
<body>
<div id="app">

<!-- TODAY -->
<div class="screen active" id="s-today">
  <div class="topbar">
    <div class="ey" id="t-date">—</div>
    <h1>Ready to <em>train?</em></h1>
  </div>
  <div class="scroll">
    <div id="t-card"></div>
    <div class="stats">
      <div class="sc"><div class="n" id="st-done">0</div><div class="l">Done</div></div>
      <div class="sc"><div class="n" id="st-streak">0</div><div class="l">Streak</div></div>
      <div class="sc"><div class="n" id="st-week">W1</div><div class="l">Week</div></div>
    </div>
    <div class="slbl">This Week</div>
    <div id="t-weekstrip"></div>
    <div class="slbl">Coming Up</div>
    <div id="t-nextup"></div>
  </div>
  <div class="nav">
    <button class="nb on" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- CALENDAR -->
<div class="screen" id="s-calendar">
  <div class="topbar"><div class="ey">4-Week Program</div><h1><em>Full</em> Schedule</h1></div>
  <div class="scroll">
    <div class="legend">
      <div class="li"><div class="ld" style="background:var(--push)"></div>Push</div>
      <div class="li"><div class="ld" style="background:var(--pull)"></div>Pull</div>
      <div class="li"><div class="ld" style="background:var(--legs)"></div>Legs</div>
      <div class="li"><div class="ld" style="background:var(--cardio)"></div>Cardio+</div>
    </div>
    <div id="cal-content"></div>
  </div>
  <div class="nav">
    <button class="nb" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb on" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- PROGRESS -->
<div class="screen" id="s-progress">
  <div class="topbar"><div class="ey">Your Gains</div><h1><em>Progress</em></h1></div>
  <div class="scroll">
    <div class="pex-filter" id="prog-filter"></div>
    <div id="prog-content"></div>
  </div>
  <div class="nav">
    <button class="nb" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb on" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- HISTORY -->
<div class="screen" id="s-history">
  <div class="topbar"><div class="ey">Workout Log</div><h1><em>History</em></h1></div>
  <div class="scroll" id="hist-content"></div>
  <div class="nav">
    <button class="nb" onclick="nav('today')"><span class="ic">🏠</span>Today</button>
    <button class="nb" onclick="nav('calendar')"><span class="ic">📅</span>Calendar</button>
    <button class="nb" onclick="nav('progress')"><span class="ic">📈</span>Progress</button>
    <button class="nb on" onclick="nav('history')"><span class="ic">📊</span>History</button>
  </div>
</div>

<!-- SESSION -->
<div class="screen" id="s-session">
  <div class="shead">
    <button class="back" onclick="exitSession()">←</button>
    <div><div class="stitle" id="sess-title">—</div><div style="font-size:11px;color:var(--muted)" id="sess-sub">—</div></div>
    <div class="sbadge" id="sess-badge">W1</div>
  </div>
  <div class="wu" id="sess-wu"></div>
  <div class="scroll" id="sess-exs"></div>
  <div class="sfooter">
    <div class="pbar"><div class="pfill" id="sess-prog" style="width:0%"></div></div>
    <button class="btn" id="sess-btn" onclick="completeSession()">Complete Workout ✓</button>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
// ━━ PROGRAM ━━
// Mon=Push, Tue=Rest, Wed=Pull, Thu=Rest, Fri=Legs+Cardio (alternating), Sat=Rest, Sun=Rest
// Week pattern (0=Mon): push, rest, pull, rest, legs, rest, rest
// Cardio replaces Legs on weeks 2 & 4 on Friday
const START = new Date('2026-06-15T00:00:00'); // Monday

// 5-day weekday pattern, weekends always rest
// dow 0=Mon,1=Tue,2=Wed,3=Thu,4=Fri,5=Sat,6=Sun
function getTypeForDay(dow, weekNum) {
  if (dow === 5 || dow === 6) return 'rest'; // weekend
  const weekdayMap = ['push','rest','pull','rest','legs'];
  let type = weekdayMap[dow];
  // Friday alternates: legs on W1&3, cardio on W2&4
  if (dow === 4) type = (weekNum % 2 === 0) ? 'legs' : 'cardio';
  return type;
}

const WORKOUTS = {
  push:{
    name:'Push Day',focus:'Chest · Shoulders · Triceps',color:'#c8f135',type:'push',
    wu:{icon:'🚴',txt:'Warmup: <strong>5 min spin bike</strong>, easy pace'},
    exs:[
      {n:'Barbell Bench Press',m:'Power Rack + Bench',note:'🔧 Grip just outside shoulder width. Feet planted. 2 sec descent, drive up. Keep shoulders pinched back.',t:['3×8','4×8','4×10','4×12']},
      {n:'Dumbbell Shoulder Press',m:'DBs 25–35 lbs',note:'🔧 Sit upright, DBs at ear level. Press straight up. Don\'t let elbows flare too far forward.',t:['3×10','3×12','4×10','4×12']},
      {n:'Machine Press',m:'Matrix Multi-Position Press',note:'🔧 Adjust seat so handles align with mid-chest. Equal control on push and return.',t:['3×12','3×12','3×15','4×12']},
      {n:'Lateral Raises',m:'DBs 10–15 lbs',note:'🔧 Slight elbow bend, lead with elbows. Stop at shoulder height. Slow and controlled — no swinging.',t:['3×12','3×15','3×15','4×15']},
      {n:'Cable Tricep Pushdown',m:'Lat pulldown station (rope)',note:'🔧 Elbows pinned to sides — they don\'t move. Split rope at bottom, fully extend. Squeeze hard.',t:['3×12','3×12','3×15','4×12']},
      {n:'Overhead Tricep Extension',m:'DBs 15–20 lbs',note:'🔧 Hold DB overhead with both hands. Lower behind head slowly. Keep elbows pointing forward, full stretch.',t:['3×12','3×12','3×15','3×15']},
    ]
  },
  pull:{
    name:'Pull Day',focus:'Back · Biceps',color:'#38bdf8',type:'pull',
    wu:{icon:'🚣',txt:'Warmup: <strong>5 min rowing machine</strong>, moderate pace'},
    exs:[
      {n:'Lat Pulldown',m:'Matrix Lat Pulldown',note:'🔧 Wide overhand grip. Lean back slightly, pull to upper chest. Squeeze shoulder blades. Control the rise.',t:['3×10','4×10','4×12','4×12']},
      {n:'Seated Cable Row',m:'Matrix Low Row',note:'🔧 Sit tall, chest up. Pull to lower chest. Hold 1 sec, fully extend on return. Don\'t round back.',t:['3×10','3×12','4×10','4×12']},
      {n:'Dumbbell Bent-Over Row',m:'DBs 30–45 lbs',note:'🔧 Flat back, hinge ~45°. Pull DB to hip, elbow close. Squeeze at top. Other hand braced on bench.',t:['3×10ea','3×12ea','3×12ea','4×10ea']},
      {n:'Face Pulls',m:'Cable station (rope)',note:'🔧 Cable at face height. Pull to face, hands beside ears, elbows flared wide. Key for shoulder health.',t:['3×15','3×15','3×20','4×15']},

// ━━ STATE ━━
let S={sessions:{}};
function save(){localStorage.setItem('gapp_v5',JSON.stringify(S));}
function load(){const r=localStorage.getItem('gapp_v5');if(r)S=JSON.parse(r);}

// ━━ HELPERS ━━
function dk(d){return d.toISOString().split('T')[0];}
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}

function getPD(date){
  const s=new Date(START);s.setHours(0,0,0,0);
  const d=new Date(date);d.setHours(0,0,0,0);
  const diff=Math.floor((d-s)/86400000);
  if(diff<0||diff>=28)return null;
  const week=Math.floor(diff/7);
  const dow=diff%7;
  return{week,dow,type:getTypeForDay(dow,week),diff};
}

function tColor(t){return{push:'#c8f135',pull:'#38bdf8',legs:'#fb923c',cardio:'#a78bfa',rest:'#2a2a2a'}[t]||'#2a2a2a';}
function tLabel(t){return{push:'Push',pull:'Pull',legs:'Legs',cardio:'Cardio+',rest:'Rest'}[t]||'Rest';}
function numSets(ex,week){const m=(ex.t[week]||ex.t[0]).match(/^(\d+)/);return m?parseInt(m[1]):3;}

// ━━ NAV ━━
let prevScreen='today';let curScreen='today';
function nav(name){
  prevScreen=curScreen;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-'+name).classList.add('active');
  const map={today:0,calendar:1,progress:2,history:3};
  const nbs=document.querySelectorAll('.nb');
  if(map[name]!==undefined)nbs[map[name]].classList.add('on');
  curScreen=name;
  if(name==='today')renderToday();
  if(name==='calendar')renderCalendar();
  if(name==='progress')renderProgress(null);
  if(name==='history')renderHistory();
}

// ━━ TODAY ━━
function renderToday(){
  const now=today();
  document.getElementById('t-date').textContent=now.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});
  const pd=getPD(now);const key=dk(now);

  let html='';
  if(!pd){
    const du=Math.floor((new Date(START)-now)/86400000);
    html=`<div class="today-card rest"><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px">Program Status</div>
    <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800">${du>0?'Starts in '+du+' day'+( du!==1?'s':''):'Complete! 🎉'}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">${du>0?'Starting Monday June 16':'4 weeks done. Incredible work.'}</div></div>`;
  } else if(pd.type==='rest'){
    const isWeekend=pd.dow===5||pd.dow===6;
    html=`<div class="today-card rest"><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px">Week ${pd.week+1} · Rest Day</div>
    <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800">${isWeekend?'Weekend Rest':'Recovery Day'}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:5px">🚴 Bike commute counts &nbsp;💧 Hit your water &nbsp;🥩 Eat your protein</div></div>`;
  } else {
    const W=WORKOUTS[pd.type];const c=W.color;
    const done=S.sessions[key]&&S.sessions[key].completed;
    html=`<div class="today-card ${pd.type}">
    <div style="font-family:'DM Mono',monospace;font-size:10px;color:${c};text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px">Week ${pd.week+1} · ${tLabel(pd.type)} Day</div>
    <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:2px">${W.name}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:11px">${W.focus}</div>
    ${done
      ?`<div class="btn" style="background:${c};opacity:.5;cursor:default">✓ Completed Today</div>`
      :`<button class="btn" style="background:${c}" onclick="startSession('${pd.type}',${pd.week},'${key}')">Start Workout →</button>`
    }</div>`;
  }
  document.getElementById('t-card').innerHTML=html;

  // Stats
  const allDone=Object.values(S.sessions).filter(s=>s.completed);
  document.getElementById('st-done').textContent=allDone.length;
  document.getElementById('st-week').textContent=pd?`W${pd.week+1}`:'—';
  let streak=0,sd=new Date(now);
  while(true){
    const spd=getPD(sd);if(!spd)break;
    if(spd.type==='rest'){sd=addDays(sd,-1);continue;}
    if(S.sessions[dk(sd)]&&S.sessions[dk(sd)].completed){streak++;sd=addDays(sd,-1);}
    else break;
  }
  document.getElementById('st-streak').textContent=streak;

  // Week strip — weekdays only (Mon–Fri)
  const dow=pd?(pd.dow):(new Date(now).getDay()+6)%7;
  const wStart=addDays(now,-dow); // back to Monday
  const dayL=['M','T','W','T','F'];
  let ws='';
  for(let i=0;i<5;i++){
    const d=addDays(wStart,i);
    const spd=getPD(d);
    const t=spd?spd.type:'rest';
    const k=dk(d);
    const isDone=S.sessions[k]&&S.sessions[k].completed;
    const isToday=dk(d)===dk(now);
    const isPast=d<now&&!isToday;
    ws+=`<div class="wchip ${t} ${isDone?'done':''} ${isPast&&t!=='rest'&&!isDone?'missed':''} ${isToday?'today':''}"
      onclick="wdayTap('${k}','${t}',${spd?spd.week:0})">
      <div class="dn">${dayL[i]}</div><div class="dd">${d.getDate()}</div></div>`;
  }
  document.getElementById('t-weekstrip').innerHTML=ws;

  // Next up — next 3 workout days
  let nu='',found=0,nd=addDays(now,1);
  while(found<3){
    const spd=getPD(nd);if(!spd)break;
    if(spd.type!=='rest'){
      const W=WORKOUTS[spd.type];
      nu+=`<div class="nextup-card" onclick="startSession('${spd.type}',${spd.week},'${dk(nd)}')">
        <div class="nuc-left">
          <div class="nuc-date">${nd.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div>
          <div class="nuc-name">${W.name}</div>
          <div class="nuc-focus">${W.focus}</div>
        </div>
        <div class="nuc-badge" style="color:${W.color};background:${W.color}18;border:1px solid ${W.color}33">W${spd.week+1} →</div>
      </div>`;
      found++;
    }
    nd=addDays(nd,1);
  }
  document.getElementById('t-nextup').innerHTML=nu||'<div class="empty"><div class="ei">🏁</div>Program complete!</div>';
}

function wdayTap(k,type,week){if(type==='rest')return;startSession(type,week,k);}

// ━━ CALENDAR — weekdays only ━━
function renderCalendar(){
  const now=today();let html='';
  for(let w=0;w<4;w++){
    const wStart=addDays(START,w*7);
    const wFri=addDays(wStart,4);
    const fmt=d=>d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
    let wDone=0,wTotal=0;
    html+=`<div class="calwk"><div class="wlbl2">Week ${w+1} — ${fmt(wStart)} to ${fmt(wFri)}</div>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:3px">`;
    ['Mon','Tue','Wed','Thu','Fri'].forEach(l=>html+=`<div class="chdr">${l}</div>`);
    html+=`</div><div class="calgrid">`;
    for(let d=0;d<5;d++){
      const date=addDays(wStart,d);
      const type=getTypeForDay(d,w);
      const k=dk(date);
      const isDone=S.sessions[k]&&S.sessions[k].completed;
      const isToday=dk(date)===dk(now);
      const isPast=date<now&&!isToday;
      const isMissed=isPast&&type!=='rest'&&!isDone;
      if(type!=='rest')wTotal++;if(isDone)wDone++;
      html+=`<div class="ccell ${type} ${isDone?'done':''} ${isMissed?'missed':''} ${isToday?'today':''}"
        onclick="calTap('${k}','${type}',${w})">
        <div class="cn">${date.getDate()}</div><div class="ca">${tLabel(type).slice(0,3)}</div></div>`;
    }
    html+=`</div><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:right;margin-top:5px">${wDone}/${wTotal} done</div></div>`;
  }
  document.getElementById('cal-content').innerHTML=html;
}

function calTap(k,type,week){if(type==='rest')return;startSession(type,week,k);}

// ━━ SESSION ━━
let CUR={type:null,week:0,key:null};

function startSession(type,week,key){
  CUR={type,week,key};
  const W=WORKOUTS[type];
  const now=today();
  const sd=new Date(key);sd.setHours(0,0,0,0);
  const isFuture=sd>now;

  if(!S.sessions[key]){
    S.sessions[key]={type,week,completed:false,
      exs:W.exs.map(ex=>({sets:Array.from({length:numSets(ex,week)},()=>({w:'',r:'',done:false})),note:''}))};
    save();
  }

  document.getElementById('sess-title').textContent=W.name;
  document.getElementById('sess-sub').textContent=W.focus;
  document.getElementById('sess-badge').textContent=`W${week+1}`;
  document.getElementById('sess-badge').style.color=W.color;
  document.getElementById('sess-badge').style.background=W.color+'22';
  document.getElementById('sess-wu').innerHTML=`<span style="font-size:16px">${W.wu.icon}</span><span>${W.wu.txt}</span>`;

  if(isFuture){
    document.getElementById('sess-btn').textContent='← Back';
    document.getElementById('sess-btn').onclick=exitSession;
    document.getElementById('sess-btn').style.cssText='background:var(--surface);color:var(--text);border:1px solid var(--border);';
  } else {
    document.getElementById('sess-btn').textContent='Complete Workout ✓';
    document.getElementById('sess-btn').onclick=completeSession;
    document.getElementById('sess-btn').style.cssText=`background:${W.color};color:#0e0e0e;border:none;`;
  }

  renderSessionExs(isFuture);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-session').classList.add('active');
}

function renderSessionExs(isFuture){
  const {type,week,key}=CUR;
  const W=WORKOUTS[type];
  const sd=S.sessions[key];
  let html='';let tot=0,dn=0;

  if(isFuture){
    const date=new Date(key);
    html=`<div class="preview-banner">📅 ${date.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})} — Preview. Logging unlocks on the day.</div>`;
  }

  W.exs.forEach((ex,ei)=>{
    const target=ex.t[week]||ex.t[0];
    const exData=sd?sd.exs[ei]:null;
    const ns=exData?exData.sets.length:numSets(ex,week);
    if(!isFuture&&exData){tot+=ns;dn+=exData.sets.filter(s=>s.done).length;}
    const history=getExHistory(type,ei);

    html+=`<div class="exc">
      <div class="exh">
        <div class="exh-top">
          <div><div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)">Ex ${ei+1}</div>
          <div class="exn">${ex.n}</div><div class="exm">${ex.m}</div></div>
          <div class="extb">${target}</div>
        </div>
        <div class="exnote">${ex.note}</div>
      </div>
      <div class="setlbls"><div class="setlbl">Set</div><div class="setlbl">lbs</div><div class="setlbl">Reps</div><div class="setlbl">✓</div></div><div>`;

    for(let si=0;si<ns;si++){
      const set=exData?exData.sets[si]:{w:'',r:'',done:false};
      html+=`<div class="setr">
        <div class="snum">${si+1}</div>
        <input class="sinput" type="number" inputmode="decimal" placeholder="lbs" value="${set.w}"
          onchange="upd(${ei},${si},'w',this.value)" ${(set.done||isFuture)?'disabled':''}>
        <input class="sinput" type="number" inputmode="numeric" placeholder="reps" value="${set.r}"
          onchange="upd(${ei},${si},'r',this.value)" ${(set.done||isFuture)?'disabled':''}>
        <button class="schk${set.done?' on':''}" onclick="${isFuture?'':` tog(${ei},${si})`}" ${isFuture?'disabled':''}>${set.done?'✓':''}</button>
      </div>`;
    }
    html+=`</div>`;

    // Mini progress chart
    html+=`<div class="prog-section"><div class="prog-title">Progress — ${ex.n}</div>`;
    if(history.length>0){
      const pr=Math.max(...history.map(h=>h.w));
      const last=history[history.length-1];
      html+=`<div class="prog-best">PR: <span>${pr} lbs</span> · Last: <span>${last.w} lbs × ${last.r} reps</span></div>
      <canvas class="minichart" id="mini-${ei}" width="600" height="96"></canvas>`;
    } else {
      html+=`<div class="no-data">No history yet — complete a session to start tracking.</div>`;
    }
    html+=`</div>`;

    if(!isFuture){
      const savedNote=exData?exData.note:'';
      html+=`<div class="notes-wrap"><div class="notes-lbl">My Notes</div>
        <textarea class="notes-input" placeholder="e.g. used 35 lbs, felt strong, increase next week..."
          onchange="updNote(${ei},this.value)">${savedNote}</textarea></div>`;
    }

    html+=`</div>`;
  });

  document.getElementById('sess-exs').innerHTML=html;
  if(!isFuture) document.getElementById('sess-prog').style.width=(tot>0?(dn/tot)*100:0)+'%';

  requestAnimationFrame(()=>{
    W.exs.forEach((_,ei)=>{
      const history=getExHistory(type,ei);
      if(history.length>0){
        const c=document.getElementById(`mini-${ei}`);
        if(c)drawChart(c,history,tColor(type),true);
      }
    });
  });
}

function upd(ei,si,field,val){
  S.sessions[CUR.key].exs[ei].sets[si][field]=val;save();
  const sd=S.sessions[CUR.key];const W=WORKOUTS[CUR.type];
  let tot=0,dn=0;
  W.exs.forEach((_,i)=>{tot+=sd.exs[i].sets.length;dn+=sd.exs[i].sets.filter(s=>s.done).length;});
  document.getElementById('sess-prog').style.width=(tot>0?(dn/tot)*100:0)+'%';
}

function tog(ei,si){
  const set=S.sessions[CUR.key].exs[ei].sets[si];
  set.done=!set.done;save();
  const now=today();const sd=new Date(CUR.key);sd.setHours(0,0,0,0);
  renderSessionExs(sd>now);
}

function updNote(ei,val){S.sessions[CUR.key].exs[ei].note=val;save();}

function completeSession(){
  S.sessions[CUR.key].completed=true;
  S.sessions[CUR.key].completedAt=new Date().toISOString();
  save();toast('Workout complete! 💪');
  setTimeout(()=>nav('today'),1100);
}

function exitSession(){nav(prevScreen==='session'?'today':prevScreen);}

// ━━ PROGRESS DATA ━━
function getExHistory(type,ei){
  return Object.entries(S.sessions)
    .filter(([k,s])=>s.completed&&s.type===type&&s.exs&&s.exs[ei])
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,s])=>{
      const dsets=s.exs[ei].sets.filter(x=>x.done&&x.w&&x.r);
      if(!dsets.length)return null;
      const bestW=Math.max(...dsets.map(x=>parseFloat(x.w)||0));
      const bestR=Math.max(...dsets.filter(x=>parseFloat(x.w)===bestW).map(x=>parseInt(x.r)||0));
      return{date:k,w:bestW,r:bestR};
    }).filter(Boolean);
}

// ━━ CHART ━━
function drawChart(canvas,history,color,mini){
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth*2;const H=canvas.offsetHeight*2;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  const vals=history.map(h=>h.w);
  const mn=Math.max(0,Math.min(...vals)*0.88);
  const mx=Math.max(...vals)*1.12;
  const pad={t:8,r:8,b:mini?16:28,l:mini?40:48};
  const gW=W-pad.l-pad.r;const gH=H-pad.t-pad.b;
  const x=i=>pad.l+i*(gW/Math.max(history.length-1,1));
  const y=v=>pad.t+gH-(((v-mn)/(mx-mn||1))*gH);

  [0,.5,1].forEach(f=>{
    const yy=pad.t+gH*(1-f);
    ctx.strokeStyle='#222';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    ctx.fillStyle='#555';ctx.font=`${mini?16:18}px DM Mono,monospace`;ctx.textAlign='right';
    ctx.fillText(Math.round(mn+(mx-mn)*f)+'lb',pad.l-4,yy+5);
  });

  if(history.length>=2){
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+gH);
    grad.addColorStop(0,color+'44');grad.addColorStop(1,color+'00');
    ctx.beginPath();ctx.moveTo(x(0),y(vals[0]));
    vals.forEach((_,i)=>{if(i>0)ctx.lineTo(x(i),y(vals[i]));});
    ctx.lineTo(x(history.length-1),pad.t+gH);ctx.lineTo(x(0),pad.t+gH);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.moveTo(x(0),y(vals[0]));
    vals.forEach((_,i)=>{if(i>0)ctx.lineTo(x(i),y(vals[i]));});
    ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
  }

  history.forEach((h,i)=>{
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(i),y(h.w),5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0e0e0e';ctx.beginPath();ctx.arc(x(i),y(h.w),2,0,Math.PI*2);ctx.fill();
    if(!mini){
      const d=new Date(h.date);
      ctx.fillStyle='#555';ctx.font='16px DM Mono,monospace';ctx.textAlign='center';
      ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x(i),H-4);
    }
  });
}

// ━━ PROGRESS TAB ━━
function renderProgress(filter){
  const types=['push','pull','legs','cardio'];
  let fhtml=`<button class="${filter===null?'on':''}" onclick="renderProgress(null)">All</button>`;
  types.forEach(t=>{
    fhtml+=`<button class="${filter===t?'on':''}" style="${filter===t?`background:${tColor(t)};border-color:${tColor(t)};color:#0e0e0e`:''}"
      onclick="renderProgress('${t}')">${tLabel(t)}</button>`;
  });
  document.getElementById('prog-filter').innerHTML=fhtml;

  const anySessions=Object.values(S.sessions).some(s=>s.completed);
  if(!anySessions){
    document.getElementById('prog-content').innerHTML='<div class="empty"><div class="ei">📈</div>Complete your first workout to start tracking progress.</div>';
    return;
  }

  let html='';
  const toShow=filter?[filter]:types;
  toShow.forEach(type=>{
    WORKOUTS[type].exs.forEach((ex,ei)=>{
      const history=getExHistory(type,ei);
      if(!history.length)return;
      const pr=Math.max(...history.map(h=>h.w));
      const gain=pr-history[0].w;
      const c=tColor(type);
      html+=`<div class="pex-card">
        <div class="pex-head">
          <div><div style="font-family:'DM Mono',monospace;font-size:9px;color:${c};text-transform:uppercase;letter-spacing:.1em">${tLabel(type)}</div>
          <div class="pex-name">${ex.n}</div></div>
          <div><div class="pex-pr">PR: ${pr} lbs</div>${gain>0?`<div style="font-size:10px;color:var(--muted);text-align:right">+${gain} lbs ↑</div>`:''}</div>
        </div>
        <div class="pex-body">
          <canvas class="fullchart" id="full-${type}-${ei}" width="600" height="140"></canvas>
          <div>${history.slice().reverse().map(h=>{
            const d=new Date(h.date);
            return `<div class="pex-hist-row"><span>${d.toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</span><span>${h.w} lbs × ${h.r} reps</span></div>`;
          }).join('')}</div>
        </div></div>`;
    });
  });

  document.getElementById('prog-content').innerHTML=html||'<div class="empty"><div class="ei">🏋️</div>No data yet for this category.</div>';
  requestAnimationFrame(()=>{
    toShow.forEach(type=>{
      WORKOUTS[type].exs.forEach((_,ei)=>{
        const h=getExHistory(type,ei);
        if(!h.length)return;
        const c=document.getElementById(`full-${type}-${ei}`);
        if(c)drawChart(c,h,tColor(type),false);
      });
    });
  });
}

// ━━ HISTORY ━━
function renderHistory(){
  const done=Object.entries(S.sessions).filter(([k,s])=>s.completed).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!done.length){
    document.getElementById('hist-content').innerHTML='<div class="empty"><div class="ei">📋</div>No workouts logged yet.</div>';
    return;
  }
  let html=`<div class="slbl">${done.length} session${done.length!==1?'s':''} logged</div>`;
  done.forEach(([k,s])=>{
    const W=WORKOUTS[s.type];const c=tColor(s.type);
    html+=`<div class="hcard" style="border-left-color:${c}">
      <div class="htop"><div><div class="hname">${W.name}</div><div style="font-size:10px;color:var(--muted)">Week ${s.week+1}</div></div>
      <div class="hdate">${new Date(k).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div></div>`;
    s.exs.forEach((exd,ei)=>{
      const ex=W.exs[ei];if(!ex)return;
      const dsets=exd.sets.filter(x=>x.done);if(!dsets.length)return;
      const bw=Math.max(...dsets.map(x=>parseFloat(x.w)||0));
      const tr=dsets.reduce((a,x)=>a+(parseInt(x.r)||0),0);
      html+=`<div class="hrow"><span>${ex.n}</span><span>${dsets.length}sets${bw>0?' · '+bw+'lb':''}${tr>0?' · '+tr+'reps':''}</span></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('hist-content').innerHTML=html;
}

// ━━ TOAST ━━
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

// ━━ PWA ━━
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

// ━━ INIT ━━
load();renderToday();
</script>
