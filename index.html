<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.json">
<title>Train Hard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap');
:root{
  --bg:#080808;--s1:#111;--s2:#181818;--s3:#202020;--border:#252525;--border2:#2e2e2e;
  --accent:#c8f135;--accent2:#a8cc1a;--text:#f2f2f2;--muted:#585858;--muted2:#888;
  --push:#c8f135;--pull:#38bdf8;--legs:#fb923c;--cardio:#a78bfa;
  --cal:#f97316;--prot:#34d399;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
#app{display:flex;flex-direction:column;height:100%;}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(16px + var(--sb));}

/* ── TOP BAR ── */
.topbar{padding:calc(var(--st)+12px) 16px 10px;flex-shrink:0;background:var(--bg);}
.topbar .ey{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
.topbar h1{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1;}
.topbar h1 em{color:var(--accent);font-style:normal;}
.topbar-row{display:flex;align-items:flex-end;justify-content:space-between;}

/* ── NAV ── */
.nav{display:flex;background:var(--s1);border-top:1px solid var(--border);padding-bottom:var(--sb);flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;background:none;border:none;color:var(--muted);font-size:8px;font-family:'DM Mono',monospace;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;transition:color .15s;}
.nb .ic{font-size:16px;line-height:1;}
.nb.on{color:var(--accent);}

/* ── SURFACE CARDS ── */
.card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.card.push{background:rgba(200,241,53,.06);border-color:rgba(200,241,53,.2);}
.card.pull{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.2);}
.card.legs{background:rgba(251,146,60,.06);border-color:rgba(251,146,60,.2);}
.card.cardio{background:rgba(167,139,250,.06);border-color:rgba(167,139,250,.2);}
.card.rest{background:var(--s1);border-color:var(--border);}

/* ── TODAY HERO ── */
.hero{border-radius:14px;padding:18px 16px 16px;margin-bottom:10px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;opacity:.08;background:currentColor;}
.hero .wk-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:6px;}
.hero .h-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:3px;}
.hero .h-sub{font-size:12px;opacity:.6;margin-bottom:14px;}
.hero-btn{display:block;width:100%;padding:12px;border:none;border-radius:9px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center;letter-spacing:.01em;transition:opacity .15s;}
.hero-btn:active{opacity:.82;}

/* ── STATS ROW ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 10px;}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center;}
.sc .n{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);line-height:1;}
.sc .l{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;margin-top:3px;letter-spacing:.1em;}

/* ── WEEK STRIP ── */
.slbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:10px 0 6px;}
.wstrip{display:flex;gap:5px;margin-bottom:10px;}
.wchip{flex:1;border-radius:9px;padding:7px 3px 6px;text-align:center;border:1px solid transparent;cursor:pointer;transition:transform .1s;}
.wchip:active{transform:scale(.94);}
.wchip .dn{font-family:'DM Mono',monospace;font-size:8px;opacity:.6;margin-bottom:2px;}
.wchip .dd{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.wchip.push{background:rgba(200,241,53,.1);color:var(--push);border-color:rgba(200,241,53,.22);}
.wchip.pull{background:rgba(56,189,248,.1);color:var(--pull);border-color:rgba(56,189,248,.22);}
.wchip.legs{background:rgba(251,146,60,.1);color:var(--legs);border-color:rgba(251,146,60,.22);}
.wchip.cardio{background:rgba(167,139,250,.1);color:var(--cardio);border-color:rgba(167,139,250,.22);}
.wchip.rest{background:var(--s1);color:var(--muted);}
.wchip.today{box-shadow:0 0 0 1.5px var(--accent);}
.wchip.done .dd::after{content:'✓';font-size:8px;display:block;color:var(--accent);}
.wchip.missed{opacity:.38;}

/* ── NEXT UP ── */
.nuc{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s;}
.nuc:active{border-color:#444;}
.nuc-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.08em;}
.nuc-name{font-weight:600;font-size:13px;margin-bottom:1px;}
.nuc-focus{font-size:11px;color:var(--muted);}
.nuc-badge{font-family:'DM Mono',monospace;font-size:10px;padding:4px 9px;border-radius:6px;flex-shrink:0;}

/* ── MACROS RING (Today diet summary) ── */
.macro-row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;margin-bottom:10px;}
.ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0;}
.ring-wrap canvas{width:80px;height:80px;}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-cal{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--text);line-height:1;}
.ring-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;}
.macro-bars{flex:1;}
.mbar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.mbar-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);width:24px;text-transform:uppercase;}
.mbar-track{flex:1;height:5px;background:var(--border2);border-radius:3px;overflow:hidden;}
.mbar-fill{height:100%;border-radius:3px;transition:width .4s;}
.mbar-val{font-family:'DM Mono',monospace;font-size:10px;color:var(--text);width:42px;text-align:right;}

/* ── DIET LOG ── */
.meal-section{margin-bottom:10px;}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.meal-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.meal-totals{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.food-item{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.food-name{font-size:13px;font-weight:500;margin-bottom:1px;}
.food-detail{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.food-macros{text-align:right;flex-shrink:0;}
.food-cal{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--cal);}
.food-prot{font-family:'DM Mono',monospace;font-size:10px;color:var(--prot);}
.food-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 0 0 10px;line-height:1;}

/* ── ADD FOOD ── */
.add-food-btn{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px dashed var(--border2);border-radius:9px;padding:10px 12px;cursor:pointer;width:100%;color:var(--muted);font-size:13px;margin-bottom:8px;transition:border-color .15s;}
.add-food-btn:active{border-color:#555;}
.add-food-btn .plus{font-size:18px;color:var(--accent);}

/* ── QUICK ADD MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;flex-direction:column;justify-content:flex-end;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--s1);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--sb));max-height:80vh;display:flex;flex-direction:column;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:12px;}
.modal-search{background:var(--s2);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;width:100%;margin-bottom:10px;}
.modal-search:focus{outline:none;border-color:var(--accent);}
.modal-search::placeholder{color:var(--muted);}
.modal-list{overflow-y:auto;flex:1;}
.modal-section-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:8px 0 5px;}
.qfood{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--s2);border:1px solid var(--border);border-radius:9px;margin-bottom:5px;cursor:pointer;transition:border-color .15s;}
.qfood:active{border-color:var(--accent);}
.qfood-name{font-size:13px;font-weight:500;}
.qfood-detail{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:1px;}
.qfood-right{text-align:right;flex-shrink:0;}
.qfood-cal{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--cal);}
.qfood-prot{font-family:'DM Mono',monospace;font-size:10px;color:var(--prot);}
.custom-form{background:var(--s2);border:1px solid var(--border2);border-radius:10px;padding:12px;margin-bottom:8px;}
.custom-form input{background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:9px 10px;color:var(--text);font-size:13px;width:100%;margin-bottom:7px;}
.custom-form input:focus{outline:none;border-color:var(--accent);}
.custom-form input::placeholder{color:var(--muted);}
.custom-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
.cf-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.btn-add{background:var(--accent);color:#080808;border:none;border-radius:8px;padding:11px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;width:100%;cursor:pointer;}
.btn-add:active{opacity:.85;}
.btn-cancel{background:none;border:1px solid var(--border2);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13px;color:var(--muted2);width:100%;cursor:pointer;margin-top:7px;}

/* ── SESSION ── */
.shead{padding:calc(var(--st)+10px) 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px;background:var(--bg);}
.back{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-size:14px;cursor:pointer;flex-shrink:0;}
.stitle{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.sbadge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:5px;margin-left:auto;flex-shrink:0;}
.wu{background:var(--s1);border-bottom:1px solid var(--border);padding:9px 16px;flex-shrink:0;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted2);}
.wu strong{color:var(--text);}

/* ── EXERCISE CARD ── */
.exc{background:var(--s2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.exh{padding:12px 13px 9px;border-bottom:1px solid var(--border);}
.exh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px;}
.exnum{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:2px;}
.exn{font-weight:600;font-size:14px;letter-spacing:-.01em;}
.exm{font-size:11px;color:var(--muted);margin-top:2px;}
.extb{font-family:'DM Mono',monospace;font-size:10px;padding:4px 8px;border-radius:5px;white-space:nowrap;background:rgba(200,241,53,.08);color:var(--accent);border:1px solid rgba(200,241,53,.18);flex-shrink:0;}
.exnote{background:var(--s3);border-radius:7px;padding:8px 10px;font-size:11px;color:var(--muted2);line-height:1.55;border-left:2px solid var(--border2);}

/* ── SET TABLE ── */
.setlbls{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:5px;padding:5px 13px 2px;}
.setlbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.08em;}
.setr{display:grid;grid-template-columns:22px 1fr 1fr 30px;align-items:center;gap:5px;padding:7px 13px;border-bottom:1px solid var(--border);}
.setr:last-child{border-bottom:none;}
.snum{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;}
.sinput{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 5px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;width:100%;text-align:center;-webkit-appearance:none;transition:border-color .15s;}
.sinput:focus{outline:none;border-color:var(--accent);}
.sinput::placeholder{color:var(--muted);font-size:11px;}
.sinput:disabled{opacity:.3;}
.schk{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;flex-shrink:0;}
.schk.on{background:var(--accent);border-color:var(--accent);color:#080808;font-weight:700;}

/* ── MINI CHART ── */
.prog-section{border-top:1px solid var(--border);padding:10px 13px;}
.prog-title{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.prog-best{font-size:11px;color:var(--muted2);margin-bottom:5px;}
.prog-best strong{color:var(--accent);font-family:'DM Mono',monospace;}
canvas.minichart{width:100%;height:44px;display:block;}
.no-data{font-size:11px;color:var(--muted);font-style:italic;}

/* ── NOTES ── */
.notes-wrap{padding:9px 13px;border-top:1px solid var(--border);}
.notes-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.notes-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;resize:none;min-height:46px;transition:border-color .15s;}
.notes-input:focus{outline:none;border-color:var(--accent);}
.notes-input::placeholder{color:var(--muted);}

/* ── SESSION FOOTER ── */
.sfooter{padding:10px 14px calc(10px + var(--sb));border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.pbar{height:2px;background:var(--border);border-radius:2px;margin-bottom:10px;overflow:hidden;}
.pfill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s;}
.btn-complete{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center;letter-spacing:.02em;transition:opacity .15s;}
.btn-complete:active{opacity:.85;}

/* ── CALENDAR ── */
.calwk{margin-bottom:16px;}
.wlbl2{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
.calgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.chdr{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-align:center;margin-bottom:3px;letter-spacing:.06em;}
.ccell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;position:relative;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
.ccell:active{transform:scale(.92);}
.ccell.push{background:rgba(200,241,53,.1);color:var(--push);border-color:rgba(200,241,53,.2);}
.ccell.pull{background:rgba(56,189,248,.1);color:var(--pull);border-color:rgba(56,189,248,.2);}
.ccell.legs{background:rgba(251,146,60,.1);color:var(--legs);border-color:rgba(251,146,60,.2);}
.ccell.cardio{background:rgba(167,139,250,.1);color:var(--cardio);border-color:rgba(167,139,250,.2);}
.ccell.rest{background:var(--s1);color:var(--muted);}
.ccell.done::after{content:'✓';position:absolute;top:2px;right:4px;font-size:8px;color:var(--accent);}
.ccell.missed{opacity:.32;}
.ccell.today{box-shadow:0 0 0 1.5px var(--accent);}
.ccell .cn{font-size:11px;font-weight:500;}
.ccell .ca{font-size:8px;opacity:.7;margin-top:1px;}

/* ── HISTORY ── */
.hcard{background:var(--s2);border-radius:11px;padding:12px;margin-bottom:8px;border-left:2px solid var(--accent);}
.htop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.hname{font-weight:600;font-size:13px;}
.hdate{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.hrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--border);}
.hrow:last-child{border-bottom:none;}
.hrow span:last-child{color:var(--text);font-family:'DM Mono',monospace;font-size:10px;}

/* ── PROGRESS ── */
.pex-card{background:var(--s2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.pex-head{padding:12px 13px 9px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.pex-type{font-family:'DM Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:2px;}
.pex-name{font-weight:600;font-size:13px;}
.pex-pr{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--accent);}
.pex-gain{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px;}
.pex-body{padding:10px 13px;}
canvas.fullchart{width:100%;height:68px;display:block;margin-bottom:8px;}
.pex-hist-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);}
.pex-hist-row:last-child{border-bottom:none;}
.pex-hist-row span:last-child{color:var(--text);font-family:'DM Mono',monospace;font-size:10px;}
.filter-row{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.filter-row button{font-family:'DM Mono',monospace;font-size:9px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;letter-spacing:.06em;text-transform:uppercase;transition:all .15s;}
.filter-row button.on{background:var(--accent);color:#080808;border-color:var(--accent);}

/* ── PREVIEW ── */
.preview-banner{background:rgba(200,241,53,.05);border:1px solid rgba(200,241,53,.15);border-radius:9px;padding:9px 13px;margin-bottom:10px;font-size:12px;color:var(--accent);text-align:center;font-family:'DM Mono',monospace;letter-spacing:.04em;}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(66px + var(--sb));left:50%;transform:translateX(-50%) translateY(14px);background:var(--accent);color:#080808;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;padding:9px 20px;border-radius:100px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;letter-spacing:.02em;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── MISC ── */
.empty{text-align:center;padding:32px 20px;color:var(--muted);font-size:13px;}
.empty .ei{font-size:28px;margin-bottom:8px;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.ld{width:6px;height:6px;border-radius:50%;}

<script>
// ━━ PROGRAM ━━
const START = new Date('2026-06-15T00:00:00');
function getTypeForDay(dow, weekNum) {
  if (dow===5||dow===6) return 'rest';
  const map=['push','rest','pull','rest','legs'];
  if (dow===4) return weekNum%2===0?'legs':'cardio';
  return map[dow];
}

  ],

  ],

    {n:'Eggs + toast (2 eggs, 2 slices)',cal:340,p:18},{n:'Oatmeal with banana',cal:350,p:12},
    {n:'Chicken rice bowl',cal:520,p:45},{n:'Protein shake + banana',cal:235,p:26},
    {n:'Grilled salmon + veggies',cal:380,p:38},{n:'Beef wrap (large)',cal:580,p:35},
    {n:'Salad with chicken (large)',cal:420,p:40},{n:'Pasta with meat sauce',cal:650,p:35},
  ],
};

const MEAL_NAMES=['Breakfast','Lunch','Dinner','Snacks'];
const CAL_GOAL=2100;const PROT_GOAL=160;

// ━━ STATE ━━
let S={sessions:{},diet:{}};
function save(){localStorage.setItem('gapp_v7',JSON.stringify(S));}
function load(){const r=localStorage.getItem('gapp_v7');if(r){try{S=JSON.parse(r);}catch(e){}}}

// ━━ HELPERS ━━
function dk(d){return d.toISOString().split('T')[0];}
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function getPD(date){
  const s=new Date(START);s.setHours(0,0,0,0);
  const d=new Date(date);d.setHours(0,0,0,0);
  const diff=Math.floor((d-s)/86400000);
  if(diff<0||diff>=28)return null;
  const week=Math.floor(diff/7),dow=diff%7;
  return{week,dow,type:getTypeForDay(dow,week),diff};
}
function tColor(t){return{push:'#c8f135',pull:'#38bdf8',legs:'#fb923c',cardio:'#a78bfa',rest:'#252525'}[t]||'#252525';}
function tLabel(t){return{push:'Push',pull:'Pull',legs:'Legs',cardio:'Cardio+',rest:'Rest'}[t]||'Rest';}
function numSets(ex,week){const m=(ex.t[week]||ex.t[0]).match(/^(\d+)/);return m?parseInt(m[1]):3;}

// Diet helpers
function getDietDay(key){
  if(!S.diet[key])S.diet[key]={meals:{Breakfast:[],Lunch:[],Dinner:[],Snacks:[]}};
  return S.diet[key];
}
function getDayTotals(key){
  const d=getDietDay(key);
  let cal=0,p=0;
  MEAL_NAMES.forEach(m=>(d.meals[m]||[]).forEach(f=>{cal+=f.cal||0;p+=f.p||0;}));
  return{cal,p};
}

// ━━ NAV ━━
let prevScreen='today';let curScreen='today';
function nav(name){
  prevScreen=curScreen;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-'+name).classList.add('active');
  const map={today:0,workout:1,diet:2,progress:3,history:4};
  const nbs=document.querySelectorAll('.nb');
  if(map[name]!==undefined){nbs[map[name]].classList.add('on');}
  curScreen=name;
  if(name==='today')renderToday();
  if(name==='workout')renderCalendar();
  if(name==='diet')renderDiet();
  if(name==='progress')renderProgress(null);
  if(name==='history')renderHistory();
}

// ━━ TODAY ━━
function renderToday(){
  const now=today();
  document.getElementById('t-date').textContent=now.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});
  const pd=getPD(now);const key=dk(now);

  // Hero card
  let hero='';
  if(!pd){
    const du=Math.floor((new Date(START)-now)/86400000);
    hero=`<div class="hero rest" style="background:var(--s1);border:1px solid var(--border);">
      <div class="wk-tag" style="color:var(--muted)">Program Status</div>
      <div class="h-title">${du>0?'Starts in '+du+' day'+(du!==1?'s':''):'Complete! 🎉'}</div>
      <div class="h-sub">${du>0?'First workout Monday June 16':'4 weeks. Done. Incredible.'}</div>
    </div>`;
  } else if(pd.type==='rest'){
    const isWE=pd.dow===5||pd.dow===6;
    hero=`<div class="hero" style="color:var(--muted2);background:var(--s1);border:1px solid var(--border);">
      <div class="wk-tag">Week ${pd.week+1} · ${isWE?'Weekend':'Rest Day'}</div>
      <div class="h-title" style="color:var(--text)">${isWE?'Weekend Rest':'Recovery'}</div>
      <div class="h-sub">🚴 Bike commute &nbsp;·&nbsp; 💧 3L water &nbsp;·&nbsp; 🥩 Hit protein</div>
    </div>`;
  } else {
    const W=WORKOUTS[pd.type];const c=W.color;
    const done=S.sessions[key]&&S.sessions[key].completed;
    hero=`<div class="hero ${pd.type}" style="color:${c}">
      <div class="wk-tag">Week ${pd.week+1} · ${tLabel(pd.type)} Day</div>
      <div class="h-title" style="color:var(--text)">${W.name}</div>
      <div class="h-sub">${W.focus}</div>
      ${done
        ?`<div class="hero-btn" style="background:${c}22;color:${c};border:1px solid ${c}33;cursor:default">✓ Completed Today</div>`
        :`<button class="hero-btn" style="background:${c};color:#080808" onclick="startSession('${pd.type}',${pd.week},'${key}')">Start Workout →</button>`
      }
    </div>`;
  }
  document.getElementById('t-hero').innerHTML=hero;

  // Stats
  const allDone=Object.values(S.sessions).filter(s=>s.completed);
  document.getElementById('st-done').textContent=allDone.length;
  document.getElementById('st-week').textContent=pd?`W${pd.week+1}`:'—';
  let streak=0,sd=new Date(now);
  while(true){const spd=getPD(sd);if(!spd)break;if(spd.type==='rest'){sd=addDays(sd,-1);continue;}if(S.sessions[dk(sd)]&&S.sessions[dk(sd)].completed){streak++;sd=addDays(sd,-1);}else break;}
  document.getElementById('st-streak').textContent=streak;

  // Week strip
  const dow=pd?pd.dow:(new Date(now).getDay()+6)%7;
  const wStart=addDays(now,-dow);
  const dayL=['M','T','W','T','F'];
  let ws='';
  for(let i=0;i<5;i++){
    const d=addDays(wStart,i);const spd=getPD(d);const t=spd?spd.type:'rest';const k=dk(d);
    const isDone=S.sessions[k]&&S.sessions[k].completed;const isToday=dk(d)===dk(now);
    const isPast=d<now&&!isToday;
    ws+=`<div class="wchip ${t} ${isDone?'done':''} ${isPast&&t!=='rest'&&!isDone?'missed':''} ${isToday?'today':''}"
      onclick="wdayTap('${k}','${t}',${spd?spd.week:0})">
      <div class="dn">${dayL[i]}</div><div class="dd">${d.getDate()}</div></div>`;
  }
  document.getElementById('t-weekstrip').innerHTML=ws;

  // Diet mini summary
  const tot=getDayTotals(key);
  const calPct=Math.min(tot.cal/CAL_GOAL*100,100);
  const protPct=Math.min(tot.p/PROT_GOAL*100,100);
  document.getElementById('t-diet-summary').innerHTML=`
    <div class="card" onclick="nav('diet')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:600;font-size:13px">Today's Intake</div>
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">Tap to log →</div>
      </div>
      <div class="mbar-row"><div class="mbar-lbl" style="color:var(--cal)">Cal</div>
        <div class="mbar-track"><div class="mbar-fill" style="width:${calPct}%;background:var(--cal)"></div></div>
        <div class="mbar-val">${tot.cal}<span style="color:var(--muted);font-size:9px">/${CAL_GOAL}</span></div></div>
      <div class="mbar-row"><div class="mbar-lbl" style="color:var(--prot)">Pro</div>
        <div class="mbar-track"><div class="mbar-fill" style="width:${protPct}%;background:var(--prot)"></div></div>
        <div class="mbar-val">${tot.p}g<span style="color:var(--muted);font-size:9px">/${PROT_GOAL}</span></div></div>
    </div>`;

  // Next up
  let nu='',found=0,nd=addDays(now,1);
  while(found<3){
    const spd=getPD(nd);if(!spd)break;
    if(spd.type!=='rest'){
      const W=WORKOUTS[spd.type];
      nu+=`<div class="nuc" onclick="startSession('${spd.type}',${spd.week},'${dk(nd)}')">
        <div><div class="nuc-date">${nd.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div>
        <div class="nuc-name">${W.name}</div><div class="nuc-focus">${W.focus}</div></div>
        <div class="nuc-badge" style="color:${W.color};background:${W.color}12;border:1px solid ${W.color}28">W${spd.week+1} →</div>
      </div>`;found++;
    }nd=addDays(nd,1);
  }
  document.getElementById('t-nextup').innerHTML=nu||'<div class="empty"><div class="ei">🏁</div>Program complete!</div>';
}

  CUR={type,week,key};
  const W=WORKOUTS[type];
  const now=today();const sd=new Date(key);sd.setHours(0,0,0,0);
  const isFuture=sd>now;
  if(!S.sessions[key]){
    S.sessions[key]={type,week,completed:false,
      exs:W.exs.map(ex=>({sets:Array.from({length:numSets(ex,week)},()=>({w:'',r:'',done:false})),note:''}))};
    save();
  }
  document.getElementById('sess-title').textContent=W.name;
  document.getElementById('sess-sub').textContent=W.focus;
  document.getElementById('sess-badge').textContent=`W${week+1}`;

  document.getElementById('sess-wu').innerHTML=`<span style="font-size:16px">${W.wu.icon}</span><span>${W.wu.txt}</span>`;
  if(isFuture){
    document.getElementById('sess-btn').textContent='← Back';

  const {type,week,key}=CUR;const W=WORKOUTS[type];const sd=S.sessions[key];

  if(isFuture){

  }
  W.exs.forEach((ex,ei)=>{
    const target=ex.t[week]||ex.t[0];const exData=sd?sd.exs[ei]:null;
    const ns=exData?exData.sets.length:numSets(ex,week);
    if(!isFuture&&exData){tot+=ns;dn+=exData.sets.filter(s=>s.done).length;}
    const history=getExHistory(type,ei);
    html+=`<div class="exc"><div class="exh">
      <div class="exh-top"><div><div class="exnum">Exercise ${ei+1}</div>
        <div class="exn">${ex.n}</div><div class="exm">${ex.m}</div></div>

      <div class="setlbls"><div class="setlbl">Set</div><div class="setlbl">lbs</div><div class="setlbl">Reps</div><div class="setlbl">✓</div></div><div>`;
    for(let si=0;si<ns;si++){
      const set=exData?exData.sets[si]:{w:'',r:'',done:false};
      html+=`<div class="setr"><div class="snum">${si+1}</div>
        <input class="sinput" type="number" inputmode="decimal" placeholder="lbs" value="${set.w}"
          onchange="upd(${ei},${si},'w',this.value)" ${(set.done||isFuture)?'disabled':''}>
        <input class="sinput" type="number" inputmode="numeric" placeholder="reps" value="${set.r}"
          onchange="upd(${ei},${si},'r',this.value)" ${(set.done||isFuture)?'disabled':''}>
        <button class="schk${set.done?' on':''}" onclick="${isFuture?'':` tog(${ei},${si})`}" ${isFuture?'disabled':''}>${set.done?'✓':''}</button></div>`;
    }
    html+=`</div><div class="prog-section"><div class="prog-title">Progress — ${ex.n}</div>`;
    if(history.length>0){
      const pr=Math.max(...history.map(h=>h.w));const last=history[history.length-1];
      html+=`<div class="prog-best">PR: <strong>${pr} lbs</strong> &nbsp;·&nbsp; Last: <strong>${last.w} lbs × ${last.r} reps</strong></div>
        <canvas class="minichart" id="mini-${ei}" width="600" height="88"></canvas>`;
    } else {html+=`<div class="no-data">No history yet — complete a session to start tracking.</div>`;}
    html+=`</div>`;
    if(!isFuture){
      const sn=exData?exData.note:'';
      html+=`<div class="notes-wrap"><div class="notes-lbl">My Notes</div>

      if(h.length>0){const c=document.getElementById(`mini-${ei}`);if(c)drawChart(c,h,tColor(type),true);}
    });

// ━━ PROGRESS ━━
function getExHistory(type,ei){
  return Object.entries(S.sessions)
    .filter(([k,s])=>s.completed&&s.type===type&&s.exs&&s.exs[ei])
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,s])=>{
      const dsets=s.exs[ei].sets.filter(x=>x.done&&x.w&&x.r);if(!dsets.length)return null;
      const bw=Math.max(...dsets.map(x=>parseFloat(x.w)||0));
      const br=Math.max(...dsets.filter(x=>parseFloat(x.w)===bw).map(x=>parseInt(x.r)||0));
      return{date:k,w:bw,r:br};
    }).filter(Boolean);
}

function drawChart(canvas,history,color,mini){
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth*2,H=canvas.offsetHeight*2;
  canvas.width=W;canvas.height=H;ctx.clearRect(0,0,W,H);
  const vals=history.map(h=>h.w);
  const mn=Math.max(0,Math.min(...vals)*.88),mx=Math.max(...vals)*1.12;
  const pad={t:8,r:8,b:mini?14:26,l:mini?38:46};
  const gW=W-pad.l-pad.r,gH=H-pad.t-pad.b;
  const x=i=>pad.l+i*(gW/Math.max(history.length-1,1));
  const y=v=>pad.t+gH-(((v-mn)/(mx-mn||1))*gH);
  [0,.5,1].forEach(f=>{
    const yy=pad.t+gH*(1-f);
    ctx.strokeStyle='#1e1e1e';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    ctx.fillStyle='#444';ctx.font=`${mini?14:16}px DM Mono,monospace`;ctx.textAlign='right';
    ctx.fillText(Math.round(mn+(mx-mn)*f)+'lb',pad.l-4,yy+5);
  });
  if(history.length>=2){
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+gH);
    grad.addColorStop(0,color+'38');grad.addColorStop(1,color+'00');
    ctx.beginPath();ctx.moveTo(x(0),y(vals[0]));
    vals.forEach((_,i)=>{if(i>0)ctx.lineTo(x(i),y(vals[i]));});
    ctx.lineTo(x(history.length-1),pad.t+gH);ctx.lineTo(x(0),pad.t+gH);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.moveTo(x(0),y(vals[0]));
    vals.forEach((_,i)=>{if(i>0)ctx.lineTo(x(i),y(vals[i]));});
    ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
  }
  history.forEach((h,i)=>{
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x(i),y(h.w),5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#080808';ctx.beginPath();ctx.arc(x(i),y(h.w),2,0,Math.PI*2);ctx.fill();
    if(!mini){const d=new Date(h.date);ctx.fillStyle='#444';ctx.font='14px DM Mono,monospace';ctx.textAlign='center';
      ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x(i),H-3);}
  });
}

function renderProgress(filter){
  const types=['push','pull','legs','cardio'];
  let fhtml=`<button class="${filter===null?'on':''}" onclick="renderProgress(null)">All</button>`;
  types.forEach(t=>{
    fhtml+=`<button class="${filter===t?'on':''}" style="${filter===t?`background:${tColor(t)};border-color:${tColor(t)};color:#080808`:''}"
      onclick="renderProgress('${t}')">${tLabel(t)}</button>`;
  });
  document.getElementById('prog-filter').innerHTML=fhtml;
  const any=Object.values(S.sessions).some(s=>s.completed);
  if(!any){document.getElementById('prog-content').innerHTML='<div class="empty"><div class="ei">📈</div>Complete your first workout to track progress.</div>';return;}
  let html='';
  (filter?[filter]:types).forEach(type=>{
    WORKOUTS[type].exs.forEach((ex,ei)=>{
      const h=getExHistory(type,ei);if(!h.length)return;
      const pr=Math.max(...h.map(x=>x.w));const gain=pr-h[0].w;const c=tColor(type);
      html+=`<div class="pex-card"><div class="pex-head">
        <div><div class="pex-type" style="color:${c}">${tLabel(type)}</div><div class="pex-name">${ex.n}</div></div>
        <div style="text-align:right"><div class="pex-pr">${pr} lbs</div>
          ${gain>0?`<div class="pex-gain">+${gain} lbs gained</div>`:''}</div></div>
        <div class="pex-body"><canvas class="fullchart" id="full-${type}-${ei}" width="600" height="136"></canvas>
          <div>${h.slice().reverse().map(x=>{const d=new Date(x.date);
            return`<div class="pex-hist-row"><span>${d.toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</span><span>${x.w} lbs × ${x.r} reps</span></div>`;
          }).join('')}</div></div></div>`;
    });
  });
  document.getElementById('prog-content').innerHTML=html||'<div class="empty"><div class="ei">🏋️</div>No data yet for this category.</div>';
  requestAnimationFrame(()=>{
    (filter?[filter]:types).forEach(type=>{WORKOUTS[type].exs.forEach((_,ei)=>{
      const h=getExHistory(type,ei);if(!h.length)return;
      const c=document.getElementById(`full-${type}-${ei}`);if(c)drawChart(c,h,tColor(type),false);
    });});
  });
}

      <div class="hdate">${new Date(k).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div></div>`;
    s.exs.forEach((exd,ei)=>{
      const ex=W.exs[ei];if(!ex)return;
      const dsets=exd.sets.filter(x=>x.done);if(!dsets.length)return;
      const bw=Math.max(...dsets.map(x=>parseFloat(x.w)||0));
      const tr=dsets.reduce((a,x)=>a+(parseInt(x.r)||0),0);
      html+=`<div class="hrow"><span>${ex.n}</span><span>${dsets.length} sets${bw>0?' · '+bw+'lb':''}${tr>0?' · '+tr+' reps':''}</span></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('hist-content').innerHTML=html;
}

// ━━ TOAST ━━
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ━━ CLOSE MODAL ON OVERLAY TAP ━━
document.getElementById('food-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ━━ PWA ━━
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

// ━━ INIT ━━
load();renderToday();
</script>
